<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' · Worksnetz'">Worksnetz</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav" class="nav">
	<a class="brand" th:href="@{/}">Works<span>netz</span></a>
	<nav>
		<a th:href="@{/}">Jobs</a>
		<th:block th:if="${currentUsername == null}">
			<a th:href="@{/login}">Log in</a>
			<a class="btn" th:href="@{/register}">Sign up</a>
		</th:block>
		<th:block th:if="${currentUsername != null}">
			<a th:href="@{/jobs/new}">Post a job</a>
			<a th:href="@{/dashboard}">Dashboard</a>
			<form th:action="@{/logout}" method="post" class="inline">
				<button type="submit" class="link" th:text="'Log out (' + ${currentUsername} + ')'">Log out</button>
			</form>
		</th:block>
	</nav>
</header>
<div th:fragment="flash">
	<p class="flash ok" th:if="${msg}" th:text="${msg}"></p>
	<p class="flash err" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
