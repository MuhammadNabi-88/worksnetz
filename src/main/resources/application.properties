spring.application.name=worksnetz

# Default: in-memory H2, no setup needed. Demo data is seeded on every start.
spring.datasource.url=jdbc:h2:mem:worksnetz;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
server.error.include-message=never

# Hosting: use the port given by the platform (Render, Railway, ...) and trust its HTTPS proxy headers
server.port=${PORT:8080}
server.forward-headers-strategy=framework
